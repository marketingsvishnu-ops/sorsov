<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEONFORGE | 4D Fitness</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#03040a;
    color:#fff;
    overflow-x:hidden;
}

:root{
    --cyan:#00f7ff;
    --pink:#ff00c8;
    --purple:#7b2cff;
    --dark:#03040a;
    --gray:#a5adbd;
}

/* =========================
   GLOBAL
========================= */

section{
    padding:110px 7%;
    position:relative;
}

.container{
    max-width:1250px;
    margin:auto;
}

.section-heading{
    text-align:center;
    margin-bottom:65px;
}

.section-heading .mini{
    color:var(--cyan);
    font-size:13px;
    letter-spacing:5px;
    font-weight:bold;
}

.section-heading h2{
    font-size:clamp(40px,5vw,70px);
    margin:15px 0;
}

.section-heading p{
    max-width:650px;
    margin:auto;
    color:var(--gray);
    line-height:1.8;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px 30px;
    border-radius:50px;
    text-decoration:none;
    background:var(--cyan);
    color:#001014;
    font-weight:bold;
    border:1px solid var(--cyan);
    cursor:pointer;
    transition:.35s;
    box-shadow:0 0 25px rgba(0,247,255,.3);
}

.btn:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:
        0 0 25px var(--cyan),
        0 0 60px rgba(0,247,255,.35);
}

.btn-outline{
    background:transparent;
    color:white;
    box-shadow:none;
    border-color:rgba(255,255,255,.3);
}

.btn-outline:hover{
    border-color:var(--cyan);
    color:var(--cyan);
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.15;
    pointer-events:none;
}

.glow.cyan{
    background:var(--cyan);
}

.glow.pink{
    background:var(--pink);
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;
    padding:20px 6%;
    background:rgba(3,4,10,.72);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:3px;
    color:white;
}

.logo span{
    color:var(--cyan);
    text-shadow:0 0 15px var(--cyan);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
    list-style:none;
}

.nav-links a{
    color:#dce1e8;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--cyan);
}

.nav-join{
    padding:11px 22px !important;
    border:1px solid var(--cyan);
    border-radius:30px;
    color:var(--cyan) !important;
}

.menu{
    display:none;
    font-size:28px;
    cursor:pointer;
    color:var(--cyan);
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    overflow:hidden;
    padding-top:130px;
}

.hero-grid{
    max-width:1350px;
    width:100%;
    margin:auto;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:60px;
}

.hero-content{
    position:relative;
    z-index:5;
}

.badge{
    display:inline-block;
    padding:10px 18px;
    border:1px solid rgba(0,247,255,.5);
    color:var(--cyan);
    border-radius:50px;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:25px;
    background:rgba(0,247,255,.04);
}

.hero h1{
    font-size:clamp(55px,7vw,105px);
    line-height:.9;
    letter-spacing:-5px;
    text-transform:uppercase;
}

.hero h1 span{
    color:var(--cyan);
    text-shadow:
        0 0 15px var(--cyan),
        0 0 50px rgba(0,247,255,.5);
}

.hero-text{
    max-width:650px;
    color:var(--gray);
    font-size:18px;
    line-height:1.8;
    margin:30px 0;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

/* HERO 4D OBJECT */

.hero-visual{
    height:600px;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1300px;
}

.hyper-space{
    position:relative;
    width:400px;
    height:400px;
    transform-style:preserve-3d;
    animation:spaceRotate 14s linear infinite;
}

.hyper-ring{
    position:absolute;
    inset:40px;
    border:2px solid var(--cyan);
    border-radius:50%;
    box-shadow:
        0 0 25px var(--cyan),
        inset 0 0 30px rgba(0,247,255,.2);
}

.hyper-ring.r2{
    transform:rotateX(70deg);
    border-color:var(--pink);
    box-shadow:0 0 25px var(--pink);
}

.hyper-ring.r3{
    transform:rotateY(70deg);
}

.hyper-ring.r4{
    transform:rotateZ(45deg) rotateX(50deg);
    border-color:#8c55ff;
}

.core{
    position:absolute;
    width:150px;
    height:150px;
    top:125px;
    left:125px;
    transform-style:preserve-3d;
    animation:coreRotate 5s linear infinite reverse;
}

.core-face{
    position:absolute;
    inset:0;
    border:2px solid white;
    background:rgba(0,247,255,.04);
    box-shadow:
        inset 0 0 30px rgba(0,247,255,.3),
        0 0 35px rgba(0,247,255,.3);
}

.f1{transform:translateZ(75px);}
.f2{transform:rotateY(90deg) translateZ(75px);}
.f3{transform:rotateY(180deg) translateZ(75px);}
.f4{transform:rotateY(-90deg) translateZ(75px);}
.f5{transform:rotateX(90deg) translateZ(75px);}
.f6{transform:rotateX(-90deg) translateZ(75px);}

.energy{
    position:absolute;
    width:20px;
    height:20px;
    background:var(--pink);
    border-radius:50%;
    box-shadow:0 0 30px var(--pink);
}

.e1{
    top:20px;
    left:20px;
    animation:energy1 5s infinite;
}

.e2{
    right:30px;
    bottom:30px;
    animation:energy2 6s infinite;
}

@keyframes spaceRotate{
    0%{
        transform:rotateX(0) rotateY(0) rotateZ(0);
    }
    100%{
        transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg);
    }
}

@keyframes coreRotate{
    from{
        transform:rotateX(0) rotateY(0);
    }
    to{
        transform:rotateX(360deg) rotateY(360deg);
    }
}

@keyframes energy1{
    0%,100%{
        transform:translate3d(0,0,0);
    }
    50%{
        transform:translate3d(250px,200px,150px);
    }
}

@keyframes energy2{
    0%,100%{
        transform:translate3d(0,0,0);
    }
    50%{
        transform:translate3d(-220px,-150px,-120px);
    }
}

/* =========================
   STATS
========================= */

.stats-section{
    padding-top:30px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.stat{
    padding:35px 20px;
    text-align:center;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.025);
    border-radius:20px;
    transition:.4s;
}

.stat:hover{
    transform:translateY(-10px);
    border-color:var(--cyan);
    box-shadow:0 0 30px rgba(0,247,255,.15);
}

.stat h3{
    font-size:45px;
    color:var(--cyan);
}

.stat p{
    color:#8993a3;
    margin-top:8px;
}

/* =========================
   ABOUT
========================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

.about-visual{
    min-height:500px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.about-box{
    width:360px;
    height:440px;
    border:1px solid rgba(0,247,255,.4);
    background:
        linear-gradient(
            145deg,
            rgba(0,247,255,.12),
            rgba(255,0,200,.05)
        );
    transform:
        perspective(900px)
        rotateY(-15deg)
        rotateX(8deg);
    border-radius:30px;
    box-shadow:
        25px 25px 80px rgba(0,0,0,.5),
        0 0 50px rgba(0,247,255,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.about-box::before{
    content:"4D";
    font-size:180px;
    font-weight:900;
    color:rgba(0,247,255,.08);
}

.about-box::after{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    border:1px solid var(--pink);
    border-radius:50%;
    animation:spin 5s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg) scale(1.3);
    }
}

.about-content h2{
    font-size:55px;
    margin-bottom:25px;
}

.about-content h2 span{
    color:var(--cyan);
}

.about-content p{
    color:var(--gray);
    line-height:1.9;
    margin-bottom:20px;
}

.check-list{
    list-style:none;
    margin:25px 0;
}

.check-list li{
    margin:14px 0;
    color:#d8dde5;
}

.check-list li::before{
    content:"✓";
    color:var(--cyan);
    font-weight:bold;
    margin-right:12px;
}

/* =========================
   SERVICES
========================= */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.service{
    min-height:300px;
    padding:35px;
    border-radius:25px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.06),
        rgba(255,255,255,.015)
    );
    border:1px solid rgba(255,255,255,.1);
    transform-style:preserve-3d;
    transition:.4s;
}

.service:hover{
    transform:
        perspective(900px)
        rotateX(8deg)
        rotateY(-8deg)
        translateZ(30px);
    border-color:var(--cyan);
    box-shadow:0 30px 70px rgba(0,0,0,.4);
}

.service-icon{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    border-radius:18px;
    background:rgba(0,247,255,.08);
    border:1px solid rgba(0,247,255,.3);
    margin-bottom:25px;
}

.service h3{
    font-size:24px;
    margin-bottom:15px;
}

.service p{
    color:var(--gray);
    line-height:1.7;
}

/* =========================
   TRAINERS
========================= */

.trainers{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.trainer{
    position:relative;
    height:430px;
    overflow:hidden;
    border-radius:25px;
    background:
        linear-gradient(
            160deg,
            #10151f,
            #05060b
        );
    border:1px solid rgba(255,255,255,.1);
}

.trainer-avatar{
    height:65%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:120px;
    background:
        radial-gradient(
            circle,
            rgba(0,247,255,.2),
            transparent 65%
        );
}

.trainer-info{
    padding:20px;
}

.trainer-info h3{
    font-size:22px;
}

.trainer-info p{
    color:var(--cyan);
    margin-top:7px;
    font-size:13px;
}

.trainer-info small{
    display:block;
    color:#858e9c;
    margin-top:10px;
}

/* =========================
   EXPERIENCE
========================= */

.experience{
    overflow:hidden;
}

.experience-box{
    min-height:500px;
    border:1px solid rgba(0,247,255,.2);
    border-radius:35px;
    padding:60px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    background:
        radial-gradient(
            circle at 80% 50%,
            rgba(255,0,200,.15),
            transparent 35%
        ),
        rgba(255,255,255,.025);
    overflow:hidden;
}

.experience-content h2{
    font-size:55px;
    margin-bottom:20px;
}

.experience-content h2 span{
    color:var(--pink);
}

.experience-content p{
    color:var(--gray);
    line-height:1.8;
    max-width:550px;
}

.experience-visual{
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1000px;
}

.portal{
    width:300px;
    height:300px;
    border-radius:50%;
    border:4px solid var(--cyan);
    box-shadow:
        0 0 30px var(--cyan),
        0 0 80px rgba(0,247,255,.3),
        inset 0 0 50px rgba(0,247,255,.2);
    transform-style:preserve-3d;
    animation:portal 4s infinite ease-in-out;
}

.portal::before,
.portal::after{
    content:"";
    position:absolute;
    border:2px solid var(--pink);
    border-radius:50%;
}

.portal::before{
    width:220px;
    height:220px;
    margin:36px;
}

.portal::after{
    width:140px;
    height:140px;
    margin:76px;
}

@keyframes portal{
    0%,100%{
        transform:rotateX(10deg) rotateY(0deg) scale(1);
    }
    50%{
        transform:rotateX(40deg) rotateY(35deg) scale(1.12);
    }
}

/* =========================
   PRICING
========================= */

.pricing{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.price-card{
    padding:45px 35px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.025);
    transition:.4s;
}

.price-card.featured{
    border-color:var(--cyan);
    box-shadow:0 0 40px rgba(0,247,255,.12);
    transform:scale(1.04);
}

.price-card:hover{
    transform:translateY(-12px);
}

.price-card h3{
    color:var(--cyan);
    letter-spacing:2px;
}

.price{
    font-size:55px;
    font-weight:900;
    margin:20px 0;
}

.price span{
    font-size:15px;
    color:#7f8998;
    font-weight:normal;
}

.price-card ul{
    list-style:none;
    margin:25px 0;
}

.price-card li{
    padding:12px 0;
    color:#aeb7c5;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.price-card li::before{
    content:"✦";
    color:var(--cyan);
    margin-right:10px;
}

/* =========================
   TESTIMONIALS
========================= */

.testimonials{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.testimonial{
    padding:35px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
}

.stars{
    color:#ffe600;
    letter-spacing:3px;
    margin-bottom:20px;
}

.testimonial p{
    color:#b0b8c5;
    line-height:1.8;
}

.user{
    margin-top:25px;
    display:flex;
    align-items:center;
    gap:15px;
}

.user-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    display:flex;
    align-items:center;
    justify-content:center;
}

.user h4{
    font-size:15px;
}

.user small{
    color:#727d8c;
}

/* =========================
   CONTACT
========================= */

.contact-grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:60px;
}

.contact-info h2{
    font-size:55px;
    margin-bottom:20px;
}

.contact-info h2 span{
    color:var(--cyan);
}

.contact-info > p{
    color:var(--gray);
    line-height:1.8;
    margin-bottom:35px;
}

.contact-item{
    display:flex;
    gap:18px;
    margin:25px 0;
}

.contact-icon{
    width:50px;
    height:50px;
    border:1px solid rgba(0,247,255,.3);
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cyan);
}

.contact-item p{
    color:#929cab;
    margin-top:5px;
}

.contact-form{
    padding:40px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.025);
    border-radius:25px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

input,
select,
textarea{
    width:100%;
    padding:17px;
    margin-bottom:15px;
    background:#080b13;
    border:1px solid rgba(255,255,255,.12);
    color:white;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--cyan);
    box-shadow:0 0 15px rgba(0,247,255,.1);
}

textarea{
    height:140px;
    resize:vertical;
}

.contact-form .btn{
    width:100%;
}

/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid rgba(255,255,255,.08);
    padding:45px 7%;
}

.footer-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.footer-logo{
    font-size:22px;
    font-weight:bold;
}

.footer-logo span{
    color:var(--cyan);
}

.footer-links{
    display:flex;
    gap:25px;
}
