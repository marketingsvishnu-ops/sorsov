body{

    overflow-x:hidden;

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,255,.15), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,0,170,.14), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(120,0,255,.08), transparent 35%);
    z-index:-5;
}

/* Moving grid */

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(0,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.08) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(500px) rotateX(60deg) scale(2);
    transform-origin:center bottom;
    animation:gridMove 8s linear infinite;
    z-index:-4;
    opacity:.35;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:0 60px;
    }
}
